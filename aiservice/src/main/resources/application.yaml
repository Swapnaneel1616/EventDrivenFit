spring:
  application:
    name: aiservice

  mongodb:
    uri: mongodb+srv://${MONGO_USERNAME}:${MONGO_PASSWORD}@cluster0.v4vwgvh.mongodb.net/${MONGO_DB:activitydb}?retryWrites=true&w=majority&appName=Cluster0
    database: airecomendationfitness

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: activity-processor-group
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.fitness.aiservice.model.Activity
        spring.json.trusted.packages: "*"

kafka:
  topic:
    name: activity-events

gemini:
  api:
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent
    key: ${GEMINI_KEY}
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
server:
  port: 8083
